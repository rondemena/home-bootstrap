# =============================================================================
# Logging Stack Helm Values (Loki Stack)
# Chart: grafana/loki-stack
# Repository: https://grafana.github.io/helm-charts
# Task: T066 - Observability: centralized log aggregation
# =============================================================================
#
# Deployment notes:
#   - Loki in single-binary (monolithic) mode for simplicity
#   - Promtail DaemonSet collects logs from all namespaces
#   - 14-day retention (336h) to manage disk usage
#   - Persistence via Longhorn StorageClass (50Gi)
#   - Grafana datasource auto-configured via the monitoring stack
#     (see monitoring/values.yaml additionalDataSources)
#   - No separate Grafana deployment here (uses kube-prometheus-stack's)
# =============================================================================

# =============================================================================
# Loki Configuration
# =============================================================================
loki:
  # -- Enable Loki deployment
  enabled: true

  # -- Loki runs in single-binary (monolithic) mode for home lab simplicity.
  # This runs all components (ingester, distributor, querier, compactor)
  # in a single process. Suitable for small-scale deployments.
  deploymentMode: SingleBinary

  # -- Persistence for Loki data (chunks and indexes)
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 50Gi
    accessModes:
      - ReadWriteOnce

  # -- Loki configuration
  config:
    # -- Authentication disabled (internal cluster service)
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    # -- Schema configuration for index and chunks
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    # -- Storage configuration (local filesystem)
    storage_config:
      filesystem:
        directory: /loki/chunks

    # -- Compactor handles retention enforcement
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    # -- Retention limits: 14 days (336 hours)
    limits_config:
      retention_period: 336h
      max_query_length: 721h
      max_query_parallelism: 32
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      per_stream_rate_limit: 5MB
      per_stream_rate_limit_burst: 15MB

    # -- Query scheduling and frontend
    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    # -- Ruler for alerting rules (disabled for home lab)
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093

  # -- Resource allocation for Loki
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

# =============================================================================
# Promtail Configuration (Log Collector DaemonSet)
# =============================================================================
promtail:
  # -- Enable Promtail as a DaemonSet on all nodes
  enabled: true

  config:
    # -- Loki push endpoint (cluster-internal)
    clients:
      - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
        tenant_id: ""

    # -- Scrape configuration for container logs
    snippets:
      # -- Add common labels to all log entries
      common:
        - action: replace
          source_labels:
            - __meta_kubernetes_pod_node_name
          target_label: node
        - action: replace
          source_labels:
            - __meta_kubernetes_namespace
          target_label: namespace
        - action: replace
          source_labels:
            - __meta_kubernetes_pod_name
          target_label: pod
        - action: replace
          source_labels:
            - __meta_kubernetes_pod_container_name
          target_label: container
        - action: replace
          source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          target_label: app

  # -- Resource allocation for Promtail (runs on every node)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Tolerations to run on all nodes including control plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

# =============================================================================
# Sub-chart Toggles
# =============================================================================

# -- Grafana: disabled (using kube-prometheus-stack Grafana instance)
# The Loki datasource is configured in monitoring/values.yaml
grafana:
  enabled: false
  # -- If Grafana were enabled, auto-configure Loki datasource
  sidecar:
    datasources:
      enabled: true

# -- Prometheus: disabled (using kube-prometheus-stack)
prometheus:
  enabled: false

# -- Fluent-bit: disabled (using Promtail instead)
fluent-bit:
  enabled: false

# -- Filebeat: disabled (using Promtail instead)
filebeat:
  enabled: false

# -- Logstash: disabled (using Promtail instead)
logstash:
  enabled: false
