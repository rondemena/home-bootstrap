# =============================================================================
# SealedSecret TEMPLATE: Harbor Registry Credentials for Jenkins
# Task: T068 - Jenkins->Harbor integration
# =============================================================================
#
# This is a TEMPLATE file. The encryptedData values are placeholders and
# MUST be replaced with actual kubeseal output before applying to the cluster.
#
# Purpose:
#   Jenkins uses these credentials to authenticate against Harbor when
#   pushing container images built during CI pipelines. The Jenkins JCasC
#   configuration in values.yaml references these via the credential id
#   "harbor-registry" in the credentials-config section.
#
# Harbor Robot Account Setup:
#
#   Option A - Via Harbor UI:
#     1. Log in to Harbor at https://harbor.apps.home.lab
#     2. Navigate to Administration > Robot Accounts
#     3. Create a new robot account:
#        - Name: robot$jenkins (or any descriptive name)
#        - Expiration: No expiration (home lab) or set as appropriate
#        - Permissions: Push and Pull artifacts on target project(s)
#     4. Save the generated robot account name and secret
#
#   Option B - Via Harbor API:
#     curl -sk -X POST "https://harbor.apps.home.lab/api/v2.0/robots" \
#       -u "admin:changeit" \
#       -H "Content-Type: application/json" \
#       -d '{
#         "name": "jenkins",
#         "description": "Jenkins CI push account",
#         "duration": -1,
#         "level": "system",
#         "permissions": [{
#           "kind": "project",
#           "namespace": "*",
#           "access": [
#             {"resource": "repository", "action": "push"},
#             {"resource": "repository", "action": "pull"},
#             {"resource": "tag", "action": "create"}
#           ]
#         }]
#       }'
#
# How to create and seal this secret:
#
#   1. Create the Harbor robot account (see above)
#
#   2. Generate the plaintext Kubernetes secret:
#      kubectl create secret generic harbor-credentials \
#        --from-literal=username='robot$jenkins' \
#        --from-literal=password='<robot-account-secret>' \
#        --namespace=jenkins \
#        --dry-run=client -o yaml > /tmp/harbor-credentials.yaml
#
#   3. Seal it with kubeseal:
#      kubeseal --format=yaml \
#        --controller-name=sealed-secrets \
#        --controller-namespace=kube-system \
#        < /tmp/harbor-credentials.yaml \
#        > code/k8s/apps/jenkins/sealed-secrets/harbor-credentials.yaml
#
#   4. Delete the plaintext file:
#      rm /tmp/harbor-credentials.yaml
#
#   5. Commit this file to the repository.
#
# Note: The Jenkins JCasC credentials-config section currently hardcodes
# "admin" as the username and uses HARBOR_ADMIN_PASSWORD. For production,
# update the JCasC to reference this Kubernetes secret instead, or use
# the Jenkins Kubernetes Credentials Provider plugin to automatically
# sync K8s secrets into Jenkins credentials.
#
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-credentials
  namespace: jenkins
  labels:
    app.kubernetes.io/part-of: jenkins
    app.kubernetes.io/component: integration
    integration: harbor
spec:
  template:
    metadata:
      name: harbor-credentials
      namespace: jenkins
      labels:
        app.kubernetes.io/part-of: jenkins
        app.kubernetes.io/component: integration
        integration: harbor
    type: kubernetes.io/basic-auth
  encryptedData:
    # REPLACE these values with the output of kubeseal (see instructions above)
    username: "REPLACE_WITH_KUBESEAL_OUTPUT"
    password: "REPLACE_WITH_KUBESEAL_OUTPUT"
