# =============================================================================
# SealedSecret TEMPLATE: Woodpecker Agent Secret
# Task: T069 - Woodpecker server-agent communication
# =============================================================================
#
# This is a TEMPLATE file. The encryptedData values are placeholders and
# MUST be replaced with actual kubeseal output before applying to the cluster.
#
# Purpose:
#   The Woodpecker agent secret is a shared token used for authenticated
#   gRPC communication between the Woodpecker server and its agents. Both
#   the server and agents must have access to the same secret value.
#
# The Woodpecker Helm values at code/k8s/apps/woodpecker/values.yaml
# reference this secret in both server and agent sections via
# extraSecretNamesForEnvFrom:
#   - woodpecker-secret
#
# The secret must contain this environment variable key:
#   - WOODPECKER_AGENT_SECRET: A random shared secret string
#
# How to generate and seal this secret:
#
#   1. Generate a random secret:
#      AGENT_SECRET=$(openssl rand -hex 32)
#
#   2. Generate the plaintext Kubernetes secret:
#      kubectl create secret generic woodpecker-secret \
#        --from-literal=WOODPECKER_AGENT_SECRET="${AGENT_SECRET}" \
#        --namespace=woodpecker \
#        --dry-run=client -o yaml > /tmp/woodpecker-secret.yaml
#
#   3. Seal it with kubeseal:
#      kubeseal --format=yaml \
#        --controller-name=sealed-secrets \
#        --controller-namespace=kube-system \
#        < /tmp/woodpecker-secret.yaml \
#        > code/k8s/apps/woodpecker/sealed-secrets/woodpecker-secret.yaml
#
#   4. Delete the plaintext file:
#      rm /tmp/woodpecker-secret.yaml
#
#   5. Commit this file to the repository.
#
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: woodpecker-secret
  namespace: woodpecker
  labels:
    app.kubernetes.io/part-of: woodpecker
    app.kubernetes.io/component: integration
    integration: agent
spec:
  template:
    metadata:
      name: woodpecker-secret
      namespace: woodpecker
      labels:
        app.kubernetes.io/part-of: woodpecker
        app.kubernetes.io/component: integration
        integration: agent
  encryptedData:
    # REPLACE this value with the output of kubeseal (see instructions above)
    WOODPECKER_AGENT_SECRET: "REPLACE_WITH_KUBESEAL_OUTPUT"
