---
# SealedSecret: Longhorn S3 backup credentials
# Target: DL360g9 NAS (MinIO gateway or TrueNAS S3 service)
# Namespace: longhorn-system
#
# To create the sealed secret:
#   1. Create a regular secret YAML with your S3 credentials:
#      kubectl create secret generic longhorn-backup-credentials \
#        --namespace longhorn-system \
#        --from-literal=AWS_ACCESS_KEY_ID=<your-access-key> \
#        --from-literal=AWS_SECRET_ACCESS_KEY=<your-secret-key> \
#        --from-literal=AWS_ENDPOINTS=https://<nas-ip>:9000 \
#        --dry-run=client -o yaml > /tmp/backup-secret.yaml
#   2. Seal it with kubeseal:
#      kubeseal --format yaml < /tmp/backup-secret.yaml > backup-credentials-sealed.yaml
#   3. Clean up the plaintext:
#      rm /tmp/backup-secret.yaml
#
# The sealed secret below is a PLACEHOLDER. Replace encrypted values
# with actual sealed data before applying.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: longhorn-backup-credentials
  namespace: longhorn-system
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: "<SEALED_VALUE>"
    AWS_SECRET_ACCESS_KEY: "<SEALED_VALUE>"
    AWS_ENDPOINTS: "<SEALED_VALUE>"
  template:
    metadata:
      name: longhorn-backup-credentials
      namespace: longhorn-system
    type: Opaque
