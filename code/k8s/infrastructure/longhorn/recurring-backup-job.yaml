---
# Longhorn RecurringJob: Daily S3 backup
# Schedule: 2:00 AM UTC daily, retain 7 backups
# Scope: Applied to the "default" volume group so all new volumes
#         created with the default StorageClass are automatically
#         included in the backup schedule.
#
# Apply after Longhorn is running:
#   kubectl apply -f recurring-backup-job.yaml

apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: backup
  groups:
    - default
  retain: 7
  concurrency: 2
  labels:
    backup-policy: daily
