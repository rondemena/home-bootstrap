---
# NOTE: This file is no longer applied directly. The Ansible playbook
# templates code/ansible/templates/argocd-apps/minio.yaml.j2 with
# domain variables and applies the rendered output via kubectl.
# This file is preserved as documentation of the default values.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: home-bootstrap
    home-bootstrap/layer: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    targetRevision: "5.*"
    chart: minio
    helm:
      releaseName: minio
      valuesObject:
        # Inline from values.yaml
        mode: standalone
        existingSecret: minio-credentials
        persistence:
          enabled: true
          storageClass: longhorn
          size: 20Gi
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: selfsigned-issuer
          hosts:
            - minio.apps.home.lab
          tls:
            - secretName: minio-tls
              hosts:
                - minio.apps.home.lab
        consoleIngress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: selfsigned-issuer
          hosts:
            - minio-console.apps.home.lab
          tls:
            - secretName: minio-console-tls
              hosts:
                - minio-console.apps.home.lab
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        buckets:
          - name: tofu-state
            policy: none
            purge: false
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
