---
# ArgoCD Application: Monitoring (kube-prometheus-stack)
# Stack: Primary — metrics, dashboards, and alerting
# Chart: prometheus-community/kube-prometheus-stack ~65.0
# Ingress: grafana.apps.home.lab, prometheus.apps.home.lab

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sdlc
    stack: primary
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "~65.0"
    helm:
      valueFiles: []
      values: |
        grafana:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: selfsigned-issuer
            hosts:
              - grafana.apps.home.lab
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.apps.home.lab
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 10Gi
        prometheus:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: selfsigned-issuer
            hosts:
              - prometheus.apps.home.lab
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.apps.home.lab
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
        alertmanager:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: selfsigned-issuer
            hosts:
              - alertmanager.apps.home.lab
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.apps.home.lab
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
