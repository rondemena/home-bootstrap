# DOCUMENTATION ONLY — actual deployment uses Jinja2 template:
# code/ansible/templates/argocd-apps/sealed-secrets.yaml.j2
# This file is the pre-templating reference. Do not kubectl apply directly.
---
# ArgoCD Application: Sealed Secrets
# Provides encrypted Kubernetes secrets safe for GitOps
# Chart: sealed-secrets/sealed-secrets
# Namespace: kube-system

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: "~2.16"
    helm:
      valueFiles: []
      values: |
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
