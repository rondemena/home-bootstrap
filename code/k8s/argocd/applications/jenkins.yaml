---
# ArgoCD Application: Jenkins
# Stack: Primary — CI/CD pipeline engine
# Chart: jenkins/jenkins ~5.0
# Ingress: jenkins.apps.home.lab
#
# NOTE: This file is no longer applied directly. The Ansible playbook
# templates code/ansible/templates/argocd-apps/jenkins.yaml.j2 with
# domain variables and applies the rendered output via kubectl.
# This file is preserved as documentation of the default values.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sdlc
    stack: primary
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: "~5.0"
    helm:
      valueFiles: []
      values: |
        controller:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: selfsigned-issuer
            hostName: jenkins.apps.home.lab
            tls:
              - secretName: jenkins-tls
                hosts:
                  - jenkins.apps.home.lab
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
        persistence:
          enabled: true
          storageClass: longhorn
          size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
