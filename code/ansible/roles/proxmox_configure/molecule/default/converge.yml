---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify role directory exists
      ansible.builtin.stat:
        path: "{{ role_path }}"
      register: role_dir
      delegate_to: localhost

    - name: Assert proxmox_configure role structure valid
      ansible.builtin.assert:
        that:
          - role_dir.stat.exists
        fail_msg: "proxmox_configure role not found"
