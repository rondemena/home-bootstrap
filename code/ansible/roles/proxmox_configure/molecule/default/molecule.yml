---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: proxmox-test
    image: "geerlingguy/docker-debian12-ansible:latest"
    pre_build_image: true
    privileged: true
provisioner:
  name: ansible
  inventory:
    host_vars:
      proxmox-test:
        pve_api_host: "192.168.2.11"
        pve_api_user: "automation@pam"
        pve_api_port: 8006
        pve_api_verify_ssl: false
        pve_no_subscription_repo: true
        pve_storage_pools:
          - name: local
            type: dir
            path: /var/lib/vz
            content: [images, rootdir, iso, snippets]
verifier:
  name: ansible
