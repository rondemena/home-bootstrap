---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check defaults exist
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
      register: defaults_file
      delegate_to: localhost

    - name: Assert defaults present
      ansible.builtin.assert:
        that: defaults_file.stat.exists
        fail_msg: "proxmox_configure defaults/main.yml not found"

    - name: Check tasks exist
      ansible.builtin.stat:
        path: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/main.yml"
      register: tasks_file
      delegate_to: localhost

    - name: Assert tasks present
      ansible.builtin.assert:
        that: tasks_file.stat.exists
        fail_msg: "proxmox_configure tasks/main.yml not found"
