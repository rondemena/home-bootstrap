---
- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary
  tags:
    - k3s-server

- name: Get current k3s version
  ansible.builtin.command:
    cmd: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists
  tags:
    - k3s-server

- name: Determine if k3s installation is needed
  ansible.builtin.set_fact:
    k3s_install_needed: >-
      {{
        not k3s_binary.stat.exists or
        (k3s_current_version.stdout is defined and
         k3s_version not in (k3s_current_version.stdout | default('')))
      }}
  tags:
    - k3s-server

- name: Determine if this is the first server node
  ansible.builtin.set_fact:
    k3s_is_first_server: "{{ inventory_hostname == groups['k3s_server'][0] }}"
  tags:
    - k3s-server

- name: Display k3s installation status
  ansible.builtin.debug:
    msg: >-
      k3s installed: {{ k3s_binary.stat.exists }},
      version match: {{ not k3s_install_needed }},
      target version: {{ k3s_version }},
      first server: {{ k3s_is_first_server }}
  tags:
    - k3s-server

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
    force: true
  when: k3s_install_needed | bool
  tags:
    - k3s-server

# ---------------------------------------------------------------------------
# First server node: initialize the HA cluster with --cluster-init
# ---------------------------------------------------------------------------
- name: Install k3s server (first node - cluster init)
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server --cluster-init {{ k3s_server_args | join(' ') }}"
  register: k3s_server_install
  changed_when: k3s_server_install.rc == 0
  when:
    - k3s_install_needed | bool
    - k3s_is_first_server | bool
  tags:
    - k3s-server

# ---------------------------------------------------------------------------
# Additional server nodes: join the existing HA cluster
# ---------------------------------------------------------------------------
- name: Install k3s server (additional nodes - join cluster)
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server --server https://{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}:6443 {{ k3s_server_args | join(' ') }}"
    K3S_TOKEN: "{{ hostvars[groups['k3s_server'][0]]['k3s_node_token'] }}"
  register: k3s_server_join
  changed_when: k3s_server_join.rc == 0
  when:
    - k3s_install_needed | bool
    - not (k3s_is_first_server | bool)
  tags:
    - k3s-server

- name: Wait for k3s server to be ready
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present
    timeout: "{{ k3s_kubeconfig_wait_timeout }}"
  tags:
    - k3s-server

- name: Wait for k3s API server to respond
  ansible.builtin.command:
    cmd: k3s kubectl get nodes
  register: k3s_api_check
  retries: "{{ k3s_api_wait_retries }}"
  delay: "{{ k3s_api_wait_delay }}"
  until: k3s_api_check.rc == 0
  changed_when: false
  tags:
    - k3s-server

- name: Ensure k3s service is enabled
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  tags:
    - k3s-server

- name: Read k3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_raw
  tags:
    - k3s-token

- name: Set k3s node token fact
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
  tags:
    - k3s-token
