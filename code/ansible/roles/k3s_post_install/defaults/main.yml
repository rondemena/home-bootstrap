---
kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
k8s_infra_dir: "{{ playbook_dir }}/../../k8s/infrastructure"
helm_timeout: "5m0s"

# Component toggles
k3s_deploy_metallb: true
k3s_deploy_longhorn: true
k3s_deploy_cert_manager: true
k3s_deploy_sealed_secrets: true

# Display variables (override to match your environment)
metallb_ip_range: "see ip-pool.yaml"
ingress_domain: "configured domain"

# Helm repositories
helm_repos:
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: longhorn
    url: https://charts.longhorn.io
  - name: jetstack
    url: https://charts.jetstack.io
  - name: sealed-secrets
    url: https://bitnami-labs.github.io/sealed-secrets
