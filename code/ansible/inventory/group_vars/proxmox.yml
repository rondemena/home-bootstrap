---
# =============================================================================
# Proxmox Group Variables
# =============================================================================

pve_api_port: 8006
pve_api_verify_ssl: false
pve_api_user: "automation@pam"
pve_cluster_name: homelab
pve_default_storage: local
pve_no_subscription_repo: true

# Storage pools — override per-host in inventory if needed
pve_storage_pools:
  - name: local
    type: dir
    path: /var/lib/vz
    content:
      - images
      - rootdir
      - iso
      - snippets

# Network bridge configuration — override per-host for different IPs
pve_network_bridges:
  - name: vmbr0
    ports: "eno1"
    vlan_aware: true
    comment: "Primary bridge - VLAN-aware trunk"
