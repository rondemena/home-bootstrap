---
# =============================================================================
# Global Variables (all hosts)
# =============================================================================
# These are defaults for all hosts. Override per-group in respective group_vars.
# =============================================================================

# SSH connection
ansible_user: admin
ansible_ssh_private_key_file: ~/.ssh/id_ed25519
ansible_python_interpreter: /usr/bin/python3

# DNS and domain
domain: "{{ lookup('env', 'DOMAIN') | default('home.lab', true) }}"
ingress_domain: "{{ lookup('env', 'INGRESS_DOMAIN') | default('apps.' + domain, true) }}"
dns_servers:
  - "{{ lookup('env', 'DNS_SERVER') | default('192.168.2.1', true) }}"
ntp_servers:
  - pool.ntp.org

# Ubuntu cloud image for VM templates
cloud_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
cloud_image_checksum: "sha256:https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
template_vmid: 9000
