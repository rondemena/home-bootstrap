---
# =============================================================================
# k3s Cluster Variables (shared by server and agent groups)
# =============================================================================

k3s_version: "v1.31.4+k3s1"

# Dynamically derive server URL from first server host
k3s_server_url: "https://{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}:6443"

# MetalLB IP pool range (must be on the same VLAN as k3s nodes)
metallb_ip_range: "{{ lookup('env', 'METALLB_IP_RANGE') | default('192.168.2.240-192.168.2.250', true) }}"

# k3s install script URL
k3s_install_script: "https://get.k3s.io"
