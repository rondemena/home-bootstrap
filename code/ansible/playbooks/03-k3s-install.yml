---
# Playbook: k3s Cluster Installation
# Target: k3s_server (first), k3s_agent (second), localhost (kubeconfig)
# Purpose: Install k3s HA cluster with embedded etcd (3 servers) and agent nodes
#
# Usage:
#   make bootstrap-k3s
#   ansible-playbook -i inventory/hosts.yml playbooks/03-k3s-install.yml
#
# Idempotency:
#   - Checks if k3s is already installed at the correct version before reinstalling
#   - k3s install script is natively idempotent (re-runs are safe)
#   - Agent join is idempotent (re-joining an existing member is a no-op)
#
# HA Notes:
#   - Servers are installed serially (serial: 1) to ensure ordered initialization
#   - First server uses --cluster-init to bootstrap embedded etcd
#   - Subsequent servers join using the token from the first server
#   - Agents join after all servers are ready
#
# Tags:
#   k3s-server   - Install k3s server only
#   k3s-agent    - Install k3s agents only
#   k3s-token    - Fetch join token from server
#   kubeconfig   - Fetch and configure kubeconfig
#   verify       - Verify cluster health

# ============================================================================
# Play 1: Install k3s servers serially for HA cluster init
# ============================================================================
# serial: 1 ensures the first server initializes the cluster with --cluster-init
# before subsequent servers attempt to join with --server.
- name: Install k3s servers
  hosts: k3s_server
  serial: 1
  gather_facts: true
  tags:
    - k3s-server

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - k3s_version is defined
          - k3s_version | length > 0
          - ansible_host is defined
        fail_msg: >-
          Missing required k3s variables. Ensure k3s_version is defined
          in group_vars/k3s_cluster.yml and ansible_host is set in inventory.
      tags:
        - always

  roles:
    - role: k3s_install

# ============================================================================
# Play 2: Install k3s agent on worker nodes
# ============================================================================
- name: Install k3s agents
  hosts: k3s_agent
  gather_facts: true
  tags:
    - k3s-agent

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - k3s_version is defined
          - k3s_server_url is defined
        fail_msg: >-
          Missing required k3s variables. Ensure k3s_version and
          k3s_server_url are defined in group_vars/k3s_cluster.yml.
      tags:
        - always

    - name: Retrieve join token from server
      ansible.builtin.set_fact:
        k3s_node_token: "{{ hostvars[groups['k3s_server'][0]]['k3s_node_token'] }}"
      tags:
        - k3s-agent

    - name: Validate join token is available
      ansible.builtin.assert:
        that:
          - k3s_node_token is defined
          - k3s_node_token | length > 0
        fail_msg: >-
          k3s node token not available. Ensure the k3s server play ran
          successfully before agent installation.
      tags:
        - k3s-agent

  roles:
    - role: k3s_install

# ============================================================================
# Play 3: Fetch kubeconfig from first server to workstation
# ============================================================================
- name: Fetch kubeconfig to workstation
  hosts: "{{ groups['k3s_server'][0] }}"
  gather_facts: false
  tags:
    - kubeconfig

  tasks:
    - name: Read kubeconfig from server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_raw
      tags:
        - kubeconfig

    - name: Ensure local .kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      tags:
        - kubeconfig

    - name: Write kubeconfig with correct server address
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig_raw.content | b64decode |
             regex_replace('https://127.0.0.1:6443',
                           'https://' + ansible_host + ':6443') }}
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: "0600"
      delegate_to: localhost
      become: false
      tags:
        - kubeconfig

    - name: Display kubeconfig location
      ansible.builtin.debug:
        msg: >-
          Kubeconfig written to {{ lookup('env', 'HOME') }}/.kube/config
          (server: https://{{ ansible_host }}:6443)
      tags:
        - kubeconfig

# ============================================================================
# Play 4: Verify cluster health (run from first server only)
# ============================================================================
- name: Verify k3s cluster
  hosts: "{{ groups['k3s_server'][0] }}"
  gather_facts: false
  tags:
    - verify

  tasks:
    - name: Get cluster node list
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o wide
      register: k3s_nodes
      changed_when: false
      tags:
        - verify

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ k3s_nodes.stdout_lines }}"
      tags:
        - verify

    - name: Verify all expected nodes are Ready
      ansible.builtin.command:
        cmd: k3s kubectl get nodes --no-headers
      register: k3s_node_status
      changed_when: false
      tags:
        - verify

    - name: Assert all nodes are Ready
      ansible.builtin.assert:
        that:
          - "'NotReady' not in k3s_node_status.stdout"
          - "k3s_node_status.stdout_lines | length >= (groups['k3s_server'] | length + groups['k3s_agent'] | length)"
        fail_msg: >-
          Not all nodes are Ready.
          Expected at least {{ groups['k3s_server'] | length + groups['k3s_agent'] | length }} nodes.
          Current status: {{ k3s_node_status.stdout }}
        success_msg: >-
          All {{ k3s_node_status.stdout_lines | length }} nodes are Ready
      tags:
        - verify

    - name: Get kube-system pod status
      ansible.builtin.command:
        cmd: k3s kubectl get pods -n kube-system
      register: k3s_system_pods
      changed_when: false
      tags:
        - verify

    - name: Display kube-system pods
      ansible.builtin.debug:
        msg: "{{ k3s_system_pods.stdout_lines }}"
      tags:
        - verify
